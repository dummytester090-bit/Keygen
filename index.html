<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Magnific Keygen</title>
    <style>
        body { font-family: system-ui; margin: 15px; background: #f5f5f5; }
        .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        input[type=password] { width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #ccc; }
        button { padding: 12px 20px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; }
        .btn-copy { background: #007bff; color: white; font-size: 14px; padding: 6px 12px; }
        .key-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        code { background: #eee; padding: 3px 6px; border-radius: 4px; }
        .status { padding: 8px; background: #eee; border-radius: 6px; margin: 10px 0; }
    </style>
</head>
<body>
    <h2>🔑 Magnific API Key Generator</h2>
    <div class="card">
        <label>Password for all accounts:</label>
        <input type="password" id="password" placeholder="Your password">
        <div style="margin-top: 12px;">
            <button class="btn-start" onclick="start()">▶ Start</button>
            <button class="btn-stop" onclick="stop()">⏹ Stop</button>
        </div>
        <div class="status" id="status">Idle</div>
    </div>
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <strong>API Keys (<span id="total">0</span>)</strong>
            <button class="btn-copy" onclick="copyAll()">Copy all</button>
        </div>
        <div id="keyList"></div>
    </div>

    <script>
        let keys = [];
        function updateUI() {
            fetch('/api/state')
                .then(r => r.json())
                .then(d => {
                    document.getElementById('status').textContent = d.status;
                    document.getElementById('total').textContent = d.total;
                    keys = d.keys;
                    const list = document.getElementById('keyList');
                    list.innerHTML = keys.map(k =>
                        `<div class="key-item"><code>${k}</code> <button class="btn-copy" onclick="copyOne('${k}')">Copy</button></div>`
                    ).join('');
                    if (d.running) setTimeout(updateUI, 2000); // poll every 2s
                });
        }

        function start() {
            const pw = document.getElementById('password').value.trim();
            if (!pw) return alert('Enter a password');
            fetch('/api/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pw})
            }).then(() => {
                document.getElementById('status').textContent = 'Creating first account...';
                updateUI(); // start polling
            });
        }

        function stop() {
            fetch('/api/stop', {method: 'POST'}).then(() => {
                document.getElementById('status').textContent = 'Stopped';
            });
        }

        function copyOne(text) {
            navigator.clipboard.writeText(text);
            alert('Copied!');
        }

        function copyAll() {
            navigator.clipboard.writeText(keys.join('\n'));
            alert('All keys copied!');
        }

        // load initial state
        updateUI();
    </script>
</body>
</html>
